name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 src/correlator.py --synthetic examples/intelligence.json results/lab.sqlite results/report.json results/report.md
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests tools --select E4,E7,E9,F && ruff format --check src tests tools
